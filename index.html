<style>

    --accent: #3b82c4;
    --purple: #6d4fc2;
    --green: #2fa36b;
    --dot-blue: #1f5fd0;
    --dot-blue-text: #1f5fd0;
    --dot-yellow: #f5b301;

    --muted: #55637d;
    --line: #dbe4f0;
    --shadow: 0 6px 24px rgba(20, 40, 75, .08);
    --on-navy: #ffffff;
    --bar-a: #1f3d75;

      --sky-2: #14213a;
      --accent: #7fb2ea;
      --purple: #b39cf5;
      --green: #5fd39b;
      --dot-blue: #6aa6ff;
      --dot-blue-text: #8fbcff;
      --dot-yellow: #f5c542;
      --dot-yellow-text: #f5c542;
      --bg: #0d1626;
      --surface: #131f36;
      --text: #e8eef8;
      --muted: #9fb0cc;
      --line: #263553;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
      --on-navy: #0d1626;
      --bar-a: #7fb2ea;
      --bar-b: #2d4a77;
    }
  }
  :root[data-theme="dark"] {
    --navy: #a9cdf3;
    --navy-2: #7fb2ea;
    --sky: #1b2c4a;
    --sky-2: #14213a;
    --accent: #7fb2ea;
    --purple: #b39cf5;
    --green: #5fd39b;
    --dot-blue: #6aa6ff;
    --dot-blue-text: #8fbcff;
    --dot-yellow: #f5c542;
    --dot-yellow-text: #f5c542;
    --bg: #0d1626;
    --surface: #131f36;
    --text: #e8eef8;
    --muted: #9fb0cc;
    --line: #263553;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    --on-navy: #0d1626;
    --bar-a: #7fb2ea;
    --bar-b: #2d4a77;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {

    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans Thai", "Sarabun", "Leelawadee UI", system-ui, -apple-system, "Segoe UI", sans-serif;

  header.top[hidden] { display: none; }
  .home-btn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    appearance: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
    color: var(--text); background: transparent; border: 1.5px solid var(--line);
    border-radius: 999px; padding: 8px 14px; min-height: 40px;

  }
  .home-btn:hover { background: var(--sky-2); }
  .home-btn:active { transform: scale(.97); }
  .home-btn svg { flex: none; }
  .home-btn { white-space: nowrap; flex: none; }
  header.top .brand { min-width: 0; line-height: 1.25; }
  @media (max-width: 420px) {
    header.top { gap: 8px; }

  .mark { display: block; flex: none; }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  .wm { font-weight: 800; letter-spacing: 1px; }
  .wm i { font-style: normal; }
  .wm i:nth-of-type(1) { color: var(--accent); }
  .wm i:nth-of-type(2) { color: var(--purple); }
  .wm i:nth-of-type(3) { color: var(--green); }
  .wm i:nth-of-type(4) { color: var(--accent); }
  .wm i:nth-of-type(5) { color: var(--purple); }
  .hero-logo { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14px 0 4px; }
  .hero-logo h1 { margin-top: 14px; }
  .hero-logo .wm { display: block; font-size: clamp(46px, 14vw, 72px); line-height: 1.1; }
  .hero-logo .sub { display: block; font-size: clamp(19px, 5vw, 24px); font-weight: 600; color: var(--muted); letter-spacing: 3px; margin-top: 2px; }
  .tagline { color: var(--purple); font-weight: 700; font-size: clamp(16px, 4.4vw, 19px); margin: 12px 0 0; }
  .th-name { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
  .purpose { margin: 22px 0 0; font-size: 16px; }
  .page-title { font-size: 19px; font-weight: 700; margin: 0 0 14px; }

  h1, h2, h3 { line-height: 1.3; margin: 0; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 26px 22px;
  }
  .lead { color: var(--muted); font-size: 16px; margin: 10px 0 0; }

  /* Intro */
  .intro h1 { font-size: clamp(30px, 8vw, 42px); font-weight: 800; }
  .axes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 22px 0 6px; padding: 0; list-style: none; }
  .axes li { background: var(--sky-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .axes b { display: block; font-size: 20px; letter-spacing: 1px; }
  .axes small { color: var(--muted); font-size: 13.5px; }
  .note {
    margin-top: 18px; padding: 12px 14px; border-radius: 14px;
    background: var(--sky-2); border: 1px dashed var(--line);
    color: var(--muted); font-size: 14px;
  }

  /* Buttons */
  .btn {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
    border-radius: 14px; padding: 13px 20px; min-height: 48px;
    transition: transform .12s ease, background .15s ease, box-shadow .15s ease, opacity .15s;
  }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn-primary { background: var(--navy); color: var(--on-navy); }
  .btn-primary:hover:not(:disabled) { background: var(--navy-2); }
  .btn-ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
  .btn-ghost:hover:not(:disabled) { background: var(--sky-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-block { width: 100%; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
  .start { margin-top: 22px; }

  .progress-meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .bar { height: 10px; background: var(--sky); border-radius: 999px; overflow: hidden; }

  .q-card { margin-top: 18px; padding: 30px 22px 24px; }
  .q-kicker { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .q-text { font-size: clamp(21px, 5.4vw, 27px); font-weight: 700; min-height: 96px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .choices.stack { grid-template-columns: 1fr; }
  .choice {
    appearance: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 20px;
    padding: 22px 12px; min-height: 76px; border-radius: 18px;
    background: var(--surface); color: var(--text); border: 2px solid var(--line);
    transition: border-color .15s, background .15s, transform .12s;
  }
  .choice.opt { font-size: 17px; font-weight: 600; text-align: left; padding: 18px 18px; }
  .choice:hover { border-color: var(--accent); background: var(--sky-2); }
  .choice:active { transform: scale(.98); }
  .choice[aria-checked="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
  .scale-opt[aria-checked="true"] .num { background: var(--on-navy); color: var(--navy); }
  .q-kicker.center, .q-text.center { text-align: center; }
  .likert { margin-top: 26px; }
  .likert-row { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
  .likert-labels { align-items: end; margin-bottom: 12px; }
  .ll { text-align: center; font-size: 12.5px; font-weight: 600; line-height: 1.35; color: var(--muted); }
  .ll.agree { color: var(--dot-blue-text); }
  .ll.disagree { color: var(--dot-yellow-text); }
  .cell { display: flex; justify-content: center; align-items: center; height: 64px; }
  .dot { --c: var(--muted); appearance: none; cursor: pointer; padding: 0; display: grid; place-items: center; border-radius: 50%; background: transparent; border: 3px solid var(--c); transition: transform .12s ease, background .15s ease, box-shadow .15s ease; }
  .dot.agree { --c: var(--dot-blue); }
  .dot.disagree { --c: var(--dot-yellow); }
  .dot.agree svg { stroke: #ffffff; }
  .dot.disagree svg { stroke: #3a2a00; }
  .dot.xl { width: 50px; height: 50px; }
  .dot.l { width: 40px; height: 40px; }
  .dot.m { width: 32px; height: 32px; }
  .dot svg { width: 60%; height: 60%; fill: none; stroke: var(--bg); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .dot:hover { background: color-mix(in srgb, var(--c) 16%, transparent); transform: scale(1.06); }
  .dot[aria-checked="true"] { background: var(--c); }
  .dot[aria-checked="true"] svg { opacity: 1; transform: none; }
  @media (min-width: 640px) {
    .dot.xl { width: 62px; height: 62px; } .dot.l { width: 50px; height: 50px; } .dot.m { width: 38px; height: 38px; }
    .cell { height: 74px; } .ll { font-size: 14px; }
  }
  .nav { display: flex; gap: 12px; margin-top: 18px; }
  .nav .btn-primary { flex: 1; }

  .enter { animation: slideIn .38s ease both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
  .enter-back { animation: slideBack .38s ease both; }
  @keyframes slideBack { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }

  /* Processing */
  .processing { text-align: center; padding: 60px 10px; }
  .spinner {
    width: 54px; height: 54px; margin: 0 auto 22px; border-radius: 50%;
    border: 5px solid var(--sky); border-top-color: var(--navy);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result */
  .gallery { margin-top: 34px; }
  .gallery-head h2 { font-size: clamp(22px, 6vw, 28px); font-weight: 800; }
  .gallery-head p { color: var(--muted); margin: 6px 0 0; }
  .type-card { margin-top: 20px; padding: 0; overflow: hidden; scroll-margin-top: 16px; }
  .type-card img { image-rendering: auto; display: block; width: 100%; aspect-ratio: 10 / 9; object-fit: cover; background: #fff; border-bottom: 1px solid var(--line); }
  .type-card .body { padding: 18px 20px 22px; }
  .tc-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tc-no { font-size: 13px; color: var(--muted); }
  .tc-code { display: inline-flex; gap: 3px; }
  .tc-code span { display: inline-grid; place-items: center; width: 26px; height: 30px; border-radius: 8px; background: var(--navy); color: var(--on-navy); font-weight: 800; font-size: 15px; }
  .tc-code span:nth-child(even) { background: var(--sky); color: var(--navy); }
  .type-card h3 { font-size: 22px; font-weight: 800; margin-top: 10px; }
  .type-card .th { color: var(--purple); font-weight: 600; margin-top: 2px; }
  .type-card .d { color: var(--muted); margin: 10px 0 0; }
  .type-card h4 { font-size: 15px; margin: 16px 0 6px; }
  .type-card ul.plain { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14.5px; }
  .type-card ul.plain li { margin: 3px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .chips li { background: var(--sky-2); border: 1px solid var(--green); color: var(--text); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .gallery-note { color: var(--muted); font-size: 13.5px; margin-top: 16px; }
  .end-cta { margin-top: 22px; text-align: center; }
  .type-illus { display: block; width: min(280px, 78%); aspect-ratio: 10 / 9; object-fit: cover; margin: 0 auto 20px; border-radius: 22px; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow); }
  .result-hero { text-align: center; padding: 34px 18px 28px; background: var(--sky-2); }
  .letters { display: flex; justify-content: center; gap: 8px; }
  .letters span {
    display: grid; place-items: center; width: clamp(58px, 17vw, 84px); height: clamp(72px, 21vw, 104px);
    border-radius: 18px; background: var(--navy); color: var(--on-navy);
    font-size: clamp(38px, 12vw, 58px); font-weight: 800; line-height: 1;
  }
  .letters span:nth-child(even) { background: var(--surface); color: var(--navy); border: 2px solid var(--navy); }
  .type-en { font-size: clamp(24px, 6.5vw, 32px); font-weight: 800; margin-top: 20px; }
  .type-th { color: var(--purple); font-weight: 600; font-size: 18px; }
  .type-desc { color: var(--muted); margin: 12px auto 0; max-width: 46ch; }

  .section { margin-top: 26px; }
  .section h2 { font-size: 20px; margin-bottom: 12px; }
  .pair { margin-bottom: 18px; }
  .pair-head { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 600; margin-bottom: 6px; gap: 8px; }
  .pair-head .r { text-align: right; }
  .pair-bar { display: flex; height: 16px; border-radius: 999px; overflow: hidden; background: var(--bar-b); }
  .pair-bar i { display: block; background: var(--bar-a); transition: width .6s ease; }
  .pair-note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .score-grid div { text-align: center; padding: 10px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
  .score-grid b { display: block; font-size: 20px; }
  .score-grid small { color: var(--muted); font-size: 12.5px; }
  .score-grid .win { background: var(--sky); border-color: var(--green); }

  .info-grid { display: grid; gap: 14px; }
  .info { border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; background: var(--surface); }
  .info h3 { font-size: 17px; margin-bottom: 6px; }
  .info ul { margin: 0; padding-left: 20px; color: var(--muted); }
  .info li { margin: 4px 0; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
  .actions .wide { grid-column: 1 / -1; }
  .disclaimer { margin-top: 24px; font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

  .credit { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
  .credit p { margin: 0; }
  .credit strong { color: var(--text); }
  .credit a { color: var(--accent); text-decoration: none; font-weight: 600; word-break: break-all; }
  .credit a:hover { text-decoration: underline; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px);
    background: var(--navy); color: var(--on-navy); padding: 11px 18px; border-radius: 999px;
    font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10;
    max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .spinner { animation: none; border-top-color: var(--navy); }
  }
  @media (min-width: 640px) {
    .wrap { padding-top: 40px; }
    .card { padding: 34px 32px; }
    .actions { grid-template-columns: repeat(4, 1fr); }
    .actions .wide { grid-column: auto; }
    .score-grid { grid-template-columns: repeat(8, 1fr); }
    .info-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

<script>
/* =========================================================

   ========================================================= */
const QUESTIONS = [
  { id: 1,  letter: "C", statement: "เวลาพบปัญหา ฉันมักรีบลงมือแก้ไข", condition: "+" },
  { id: 2,  letter: "C", statement: "ฉันอยากเติบโตในการทำงาน ถึงแม้จะต้องเผชิญกับความยากลำบาก", condition: "+" },
  { id: 3,  letter: "K", statement: "ฉันรู้สึกเฉย ๆ เมื่อคนในทีมขัดแย้งกัน", condition: "-" },
  { id: 4,  letter: "K", statement: "ฉันยอมช่วยเหลือผู้อื่น ถึงแม้งานของตัวเองจะมีจำนวนมาก", condition: "+" },
  { id: 5,  letter: "I", statement: "ฉันชอบทำงานร่วมกับคนที่มีแบบแผนชัดเจน", condition: "+" },
  { id: 6,  letter: "I", statement: "ฉันไม่ชอบงานที่ไม่มีเป้าหมาย", condition: "-" },
  { id: 7,  letter: "P", statement: "ฉันชอบออกความคิดเห็นมากกว่าการลงมือทำ", condition: "-" },
  { id: 8,  letter: "P", statement: "ฉันนำประสบการณ์ที่เคยทำสำเร็จมาประยุกต์ใช้กับสถานการณ์ปัจจุบัน", condition: "+" },
  { id: 9,  letter: "D", statement: "ฉันรู้สึกอึดอัดเมื่อเป้าหมายของงานไม่ชัดเจน", condition: "+" },
  { id: 10, letter: "D", statement: "ฉันมักเป็นคนตัดสินใจเมื่อทีมประสบปัญหา", condition: "+" },
  { id: 11, letter: "A", statement: "ฉันยอมรับได้หากเพื่อนมาสายประมาณ 40 นาที", condition: "+" },
  { id: 12, letter: "A", statement: "ฉันไม่ชอบเป้าหมายของทีมที่มีความไม่แน่นอน", condition: "-" },

];

const PAIRS = [["C", "K"], ["I", "P"], ["D", "A"], ["E", "R"]];

const LETTER_INFO = {
  C: { en: "Competitive", th: "แข่งขัน" },
  K: { en: "Cooperative", th: "ร่วมมือ" },
  I: { en: "Imaginative", th: "จินตนาการ" },

function freshState() {
  return { screen: "intro", idx: 0, answers: Array(QUESTIONS.length).fill(null), tb: {} };
}
let state = freshState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.answers) || s.answers.length !== QUESTIONS.length) return;
    const answers = s.answers.map(a => (Number.isInteger(a) && a >= 1 && a <= 5 ? a : null));
    const tb = {};
    if (s.tb && typeof s.tb === "object") {
      Object.keys(TIEBREAKS).forEach(k => {
        const v = s.tb[k];
        if (TIEBREAKS[k].options.some(o => o.letter === v)) tb[k] = v;
      });
    }
    const screen = ["intro", "quiz", "result"].includes(s.screen) ? s.screen : "intro";
    state = { screen, idx: Math.max(0, Math.min(Number(s.idx) || 0, 20)), answers, tb };
    // ตรวจสอบความสมบูรณ์ของข้อมูล
    if (state.screen === "result" && !resolveType()) state.screen = "quiz";
    if (state.screen === "quiz") {
      const items = getItems();
      state.idx = Math.min(state.idx, items.length - 1);
    }
  } catch (e) { state = freshState(); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

function calcScores(answers) {
  // คะแนนตัวอักษรละ 2–10: ข้อเงื่อนไข "+" ใช้คะแนนที่เลือก (1–5) ข้อเงื่อนไข "-" กลับคะแนน (6 - คะแนน)
  const scores = { C: 0, K: 0, I: 0, P: 0, D: 0, A: 0, E: 0, R: 0 };
  QUESTIONS.forEach((q, i) => {
    const v = answers[i];
    if (v === null || v === undefined) return;
    scores[q.letter] += q.condition === "+" ? v : 6 - v;
  });
  return scores;
}
function allBaseAnswered() { return state.answers.every(a => a !== null); }
function tiedKeys(scores) { return PAIRS.filter(([a, b]) => scores[a] === scores[b]).map(([a, b]) => a + b); }

function getItems() {
  const items = QUESTIONS.map((q, i) => ({ type: "q", q, i }));
  if (allBaseAnswered()) {
    tiedKeys(calcScores(state.answers)).forEach(k => items.push({ type: "tb", key: k }));
  }
  return items;
}
function isAnswered(item) {
  return item.type === "q" ? state.answers[item.i] !== null : !!state.tb[item.key];
}
function resolveType() {
  if (!allBaseAnswered()) return null;
  const scores = calcScores(state.answers);
  const letters = [];
  for (const [a, b] of PAIRS) {
    if (scores[a] > scores[b]) letters.push(a);
    else if (scores[b] > scores[a]) letters.push(b);
    else if (state.tb[a + b]) letters.push(state.tb[a + b]);
    else return null;
  }
  return { code: letters.join(""), scores, letters };
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fallback below */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function wrapLines(ctx, text, maxWidth) {
  let words;
  if (typeof Intl !== "undefined" && Intl.Segmenter) {
    words = Array.from(new Intl.Segmenter("th", { granularity: "word" }).segment(text), x => x.segment);
  } else { words = Array.from(text); }
  const lines = []; let cur = "";
  words.forEach(w => {
    if (ctx.measureText(cur + w).width > maxWidth && cur) { lines.push(cur.trim()); cur = w; }
    else cur += w;
  });
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

async function downloadImage() {
  const r = resolveType();
  if (!r) return;
  const type = TYPES[r.code];
  try { await document.fonts.load('700 40px "Noto Sans Thai"'); await document.fonts.load('400 30px "Noto Sans Thai"'); } catch (e) {}
  const W = 1080, H = 1500;
  const illus = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = TYPE_IMAGES[r.code]; });
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const FONT = '"Noto Sans Thai", "Sarabun", "Leelawadee UI", sans-serif';

  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#eef6fd"; ctx.fillRect(0, 0, W, 1010);
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";

  ctx.fillStyle = "#14284b"; ctx.font = `800 44px ${FONT}`;
  ctx.fillText("G.U.I.D.E. Personality Test Report", W / 2, 84);
  ctx.fillStyle = "#6d4fc2"; ctx.font = `600 28px ${FONT}`;
  ctx.fillText("Get Your Identity, Discover Employee Potential", W / 2, 132);

  // illustration
  const iw = 340, ih = Math.round(340 * 360 / 400), ix = (W - iw) / 2, iy = 165;
  if (illus) {
    ctx.save();
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(ix, iy, iw, ih, 30) : ctx.rect(ix, iy, iw, ih);
    ctx.clip(); ctx.drawImage(illus, ix, iy, iw, ih); ctx.restore();
  }

  // letter tiles
  const tw = 130, th = 150, gap = 16;
  const startX = (W - (tw * 4 + gap * 3)) / 2;
  r.letters.forEach((l, i) => {
    const x = startX + i * (tw + gap), y = 500;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, tw, th, 26) : ctx.rect(x, y, tw, th);
    if (i % 2 === 0) { ctx.fillStyle = "#14284b"; ctx.fill(); ctx.fillStyle = "#ffffff"; }
    else { ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = "#14284b"; ctx.stroke(); ctx.fillStyle = "#14284b"; }
    ctx.font = `800 88px ${FONT}`;
    ctx.fillText(l, x + tw / 2, y + 108);
  });

  ctx.fillStyle = "#14284b"; ctx.font = `800 64px ${FONT}`;
  ctx.fillText(type.en, W / 2, 735);
  ctx.fillStyle = "#6d4fc2"; ctx.font = `600 40px ${FONT}`;
  ctx.fillText(type.th, W / 2, 795);
  ctx.fillStyle = "#55637d"; ctx.font = `400 32px ${FONT}`;
  wrapLines(ctx, type.desc, 820).slice(0, 3).forEach((ln, i) => ctx.fillText(ln, W / 2, 862 + i * 48));

  // bars
  let y = 1085;
  PAIRS.forEach(([a, b]) => {
    const sa = r.scores[a], sb = r.scores[b], sum = sa + sb;
    const bx = 120, bw = W - 240, bh = 26;
    ctx.textAlign = "left"; ctx.fillStyle = "#14284b"; ctx.font = `600 30px ${FONT}`;
    ctx.fillText(`${a} ${LETTER_INFO[a].en} (${sa})`, bx, y);
    ctx.textAlign = "right";
    ctx.fillText(`(${sb}) ${LETTER_INFO[b].en} ${b}`, bx + bw, y);
    ctx.fillStyle = "#9cc7ee"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, y + 18, bw, bh, 13) : ctx.rect(bx, y + 18, bw, bh); ctx.fill();
    const lw = sum === 0 ? bw / 2 : (sa / sum) * bw;
    if (lw > 0) {
      ctx.fillStyle = "#1f3d75"; ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(bx, y + 18, Math.max(lw, 26), bh, 13) : ctx.rect(bx, y + 18, lw, bh);
      ctx.fill();
    }
    y += 92;
  });

  ctx.textAlign = "center"; ctx.fillStyle = "#55637d"; ctx.font = `400 26px ${FONT}`;
  ctx.fillText("แบบสำรวจตนเองเท่านั้น ไม่ใช่การวินิจฉัยทางจิตวิทยา", W / 2, H - 45);

  canvas.toBlob(blob => {
    if (!blob) { toast("สร้างภาพไม่สำเร็จ ลองอีกครั้ง"); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `GUIDE-${r.code}.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("ดาวน์โหลดภาพแล้ว");
  }, "image/png");
}

let advanceTimer = null;
function autoAdvance() {
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => { if (state.screen === "quiz") actions.next(); }, 340);
}

const actions = {
  scrollTypes() {
    const el = document.getElementById("types");
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  },
  start() {
    if (state.answers.every(a => a === null)) state.idx = 0;
    state.screen = "quiz";
    if (state.idx >= getItems().length) state.idx = 0;
    saveState(); renderQuiz(true); window.scrollTo({ top: 0 });
  },
  restart() { state = freshState(); saveState(); state.screen = "quiz"; saveState(); renderQuiz(true); },
  answer(btn) {
    const item = getItems()[state.idx];
    if (!item || item.type !== "q") return;
    const v = parseInt(btn.dataset.value, 10);
    if (!(v >= 1 && v <= 5)) return;
    state.answers[item.i] = v;
    saveState(); renderQuiz(false);
    refocus('.dot[aria-checked="true"]');
    autoAdvance();
  },
  choose(btn) {
    const item = getItems()[state.idx];
    if (!item || item.type !== "tb") return;
    state.tb[item.key] = btn.dataset.letter;
    saveState(); renderQuiz(false);
    refocus('.choice[aria-checked="true"]');
    autoAdvance();
  },
  next() {
    clearTimeout(advanceTimer);
    const items = getItems();
    const item = items[state.idx];
    if (!item || !isAnswered(item)) return;
    if (state.idx < items.length - 1) { state.idx++; saveState(); renderQuiz(true); }
    else finish();
  },
  back() {
    clearTimeout(advanceTimer);
    if (state.idx > 0) { state.idx--; saveState(); renderQuiz("back"); }
  },
  retake() {
    state = freshState(); saveState(); renderIntro(); window.scrollTo({ top: 0 });
  },
  home() {
    clearTimeout(advanceTimer);
    const wasQuiz = state.screen === "quiz" && state.answers.some(a => a !== null);
    state.screen = "intro";
    saveState();
    renderIntro();
    window.scrollTo({ top: 0 });
    if (wasQuiz) toast("บันทึกความคืบหน้าไว้แล้ว กด “เริ่ม” เพื่อทำต่อ");
  },
  async copy() {
    const ok = await copyText(summaryText());
    toast(ok ? "คัดลอกผลลัพธ์แล้ว" : "คัดลอกไม่สำเร็จ ลองเลือกข้อความเอง");
  },
  download() { downloadImage(); },
  async share() {
    const text = summaryText();
    const r = resolveType();
    if (navigator.share) {
      try {
        const data = { title: "G.U.I.D.E. Personality Test", text };
        if (/^https?:/.test(location.href)) data.url = location.href.split("#")[0];
        await navigator.share(data);
        return;
      } catch (e) { if (e && e.name === "AbortError") return; }
    }
    const ok = await copyText(text);
    toast(ok ? "คัดลอกข้อความสำหรับแชร์แล้ว นำไปวางได้เลย" : "แชร์ไม่สำเร็จ");
  }
};

document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const cur = document.activeElement;
  if (!cur || !cur.classList || !cur.classList.contains("dot")) return;
  const dots = Array.from(app.querySelectorAll(".dot"));
  const k = dots.indexOf(cur) + (e.key === "ArrowRight" ? 1 : -1);
  if (k >= 0 && k < dots.length) { e.preventDefault(); dots[k].focus(); }
});

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const fn = actions[btn.dataset.action];
  if (fn) fn(btn);
});

/* เริ่มต้น */
if (trackingEnabled()) {
  const f = document.querySelector(".credit");
  if (f) { const p = document.createElement("p"); p.className = "credit-privacy"; p.style.marginTop = "10px"; p.style.fontSize = "12.5px"; p.textContent = "เว็บนี้นับเฉพาะจำนวนผู้ทำแบบทดสอบเสร็จ ไม่บันทึกคำตอบ ผลลัพธ์ หรือข้อมูลส่วนบุคคล"; f.appendChild(p); }
}
document.getElementById("top").innerHTML = COMPASS_SVG(34) + `<div class="brand">${WORDMARK} Personality Test</div>` +
  `<button type="button" class="home-btn" data-action="home" aria-label="กลับหน้าหลัก"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg>หน้าหลัก</button>`;
loadState();
if (state.screen === "result") renderResult(); else render(true);
</script>
</body>
